name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Validate YAML
        run: |
          python3 - <<'PY'
          import yaml
          for path in ["docker-compose.yml", "searxng/settings.yml", ".github/workflows/ci.yml"]:
              yaml.safe_load(open(path))
              print(f"{path}: ok")
          PY

  unit-tests:
    name: CLI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r client/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  integration:
    name: Build, start and verify the stack
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Create CI environment file
        # Throwaway credentials that exist only for this job.
        run: |
          cp .env.example .env
          docker compose build caddy
          IMAGE="$(docker compose config --images | grep quietsearch-caddy)"
          HASH="$(docker run --rm "$IMAGE" caddy hash-password --plaintext "ci-$(openssl rand -hex 8)")"
          sed -i "s|^SEARXNG_SECRET=.*|SEARXNG_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^BASIC_AUTH_HASH=.*|BASIC_AUTH_HASH='$HASH'|" .env
          docker compose config --quiet

      - name: Validate Caddyfile
        run: |
          IMAGE="$(docker compose config --images | grep quietsearch-caddy)"
          HASH="$(docker run --rm "$IMAGE" caddy hash-password --plaintext throwaway)"
          docker run --rm \
            -e SEARXNG_HOSTNAME=localhost -e ACME_EMAIL=ci@example.org \
            -e BASIC_AUTH_USER=ci -e BASIC_AUTH_HASH="$HASH" \
            -v "$PWD/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$IMAGE" caddy validate --config /etc/caddy/Caddyfile

      - name: Start stack
        run: ./scripts/start.sh

      - name: Security checks
        run: ./tests/security_check.sh

      - name: Health report
        run: ./scripts/healthcheck.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Stop stack
        if: always()
        run: ./scripts/stop.sh --purge
