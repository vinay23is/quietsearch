# Quietsearch: SearXNG behind a TLS-terminating, rate-limiting reverse proxy.
#
#   Internet ──443/80──▶ caddy ──(quietsearch network)──▶ searxng ──▶ upstream engines
#
# Only the caddy service publishes ports. SearXNG is reachable solely over
# the private Docker network defined at the bottom of this file.

name: quietsearch

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    # Stock Caddy plus the rate_limit module (see reverse-proxy/Dockerfile).
    build:
      context: ./reverse-proxy
      args:
        CADDY_VERSION: ${CADDY_VERSION:?set CADDY_VERSION in .env}
    image: quietsearch-caddy:${CADDY_VERSION}
    container_name: quietsearch-caddy
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:80:80"
      - "${PUBLISH_ADDR:-127.0.0.1}:443:443"
    environment:
      SEARXNG_HOSTNAME: ${SEARXNG_HOSTNAME:?set SEARXNG_HOSTNAME in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in .env}
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./reverse-proxy/site:/srv/site:ro      # About/Privacy pages and branding
      - caddy-data:/data        # certificates and ACME account (must persist)
      - caddy-config:/config
    networks:
      - quietsearch
    # Root filesystem is read-only; Caddy writes only to its volumes and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:?set SEARXNG_VERSION in .env}
    container_name: quietsearch-searxng
    restart: unless-stopped
    # No "ports:" on purpose. Only caddy can reach this service.
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      SEARXNG_BASE_URL: https://${SEARXNG_HOSTNAME}/
      # Config files are mounted read-only and stay owned by you; skip the
      # image's chown of /etc/searxng.
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    networks:
      - quietsearch
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

networks:
  # Private bridge network shared by caddy and searxng. SearXNG needs
  # outbound internet access to query upstream engines.
  quietsearch:

volumes:
  caddy-data:
  caddy-config:
  searxng-cache:
